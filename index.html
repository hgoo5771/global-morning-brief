<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Morning Brief</title>

    <!-- 글꼴: 본문 Pretendard, 제목 Noto Serif KR -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 배경 애니메이션 (animation.js가 그림) -->
    <canvas id="bg-canvas" aria-hidden="true"></canvas>

    <!-- 맨 위 얇은 머리띠 -->
    <header class="masthead">
        <div class="masthead-inner">
            <span class="brand">Global Morning Brief</span>
            <span class="read-time" id="read-time"></span>
        </div>
    </header>

    <main>

        <!-- 1. 첫 화면: 날짜, 제목, 밤사이 흐름 요약 -->
        <section class="hero">
            <p class="hero-date" id="today"></p>
            <h1>Overnight, the World Changed.</h1>
            <p class="hero-lead" id="intro">지난밤 세계 경제에서 일어난 중요한 변화를 확인해 보세요.</p>
        </section>

        <!-- 2. 밤사이 타임라인: 기사가 나온 시각을 점으로 표시 (script.js가 채움) -->
        <section class="timeline" id="timeline" hidden>
            <div class="timeline-head">
                <h2>밤사이 뉴스가 나온 시각</h2>
                <p class="timeline-range" id="timeline-range"></p>
            </div>
            <div class="timeline-band">
                <div class="timeline-ticks" id="timeline-ticks"></div>
                <div class="timeline-dots" id="timeline-dots"></div>
            </div>
            <p class="timeline-hint">점을 누르면 해당 기사로 이동해요.</p>
        </section>

        <!-- 3. 카테고리 바로가기 (스크롤해도 위에 붙어 있음) -->
        <nav class="cat-nav" id="cat-nav" aria-label="카테고리 바로가기"></nav>

        <!-- 4. 카테고리별 뉴스 목록 (script.js가 채움) -->
        <div class="stories" id="news-list">
            <p class="status">브리핑을 불러오는 중...</p>
        </div>

    </main>

    <footer class="site-footer">
        <p>요약은 AI가 각 기사의 제목과 소개문을 바탕으로 작성했어요. 중요한 내용은 원문에서 확인하세요.</p>
    </footer>

    <script src="script.js"></script>
    <script src="animation.js"></script>
</body>
</html>
